<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persia 2099 — Metadata Update</title>

<style>
body{
  background:#05070b;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
  max-width:700px;
  margin:auto
}
h1{
  text-align:center;
  color:#d4af37
}
h2{text-align:center}
button{
  width:100%;
  padding:18px;
  margin:10px 0;
  border:0;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
}
#connect{
  background:#d4af37;
  color:#000;
}
#update{
  background:#2563eb;
  color:#fff;
}
button:disabled{
  opacity:.45;
}
#wallet{
  text-align:center;
  color:#aaa;
  margin:15px 0;
  word-break:break-all;
}
.asset{
  border:1px solid #333;
  border-radius:8px;
  padding:12px;
  margin:10px 0;
  word-break:break-word;
}
.ok{color:#4ade80}
.error{color:#f87171}
</style>
</head>

<body>

<h1>PERSIA 2099</h1>
<h2>METADATA UPDATE</h2>

<div id="wallet">Wallet not connected</div>

<button id="connect">
CONNECT PHANTOM
</button>

<button id="update" disabled>
UPDATE ALL 6 ASSETS
</button>

<div id="status"></div>

<script type="module">

import {
  createUmi,
  publicKey,
  signerIdentity,
  createSignerFromKeypair,
  transactionBuilder
} from "https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  mplCore,
  update
} from "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0?deps=@metaplex-foundation/umi@1.4.1";


const ASSETS = [

{
number:"001",
name:"Arash 2099",
address:"D4CBoNmuCm2GDSwJi2YHyxTMte66nJGNYE55WJWa4kzU"
},

{
number:"002",
name:"Cyrus Prime",
address:"47KQo8ddMP2q6z3zzs1E85f24cRgEFCe52iudvY2eG2K"
},

{
number:"003",
name:"Mithra",
address:"3ZUJcmFQMcGbk4MdAeGoY3DLkY1us2hxbbFNzeD1H9mZ"
},

{
number:"004",
name:"Anahita",
address:"BmUjwD3D3bPDYGu7hoR38VNNnhbcSxBwJgnRxkFpCxGk"
},

{
number:"005",
name:"Rostam X",
address:"9xHiNWXKfuhE2rVvCZXqNmD2gSLKj4KwRbRTTbLf2StS"
},

{
number:"006",
name:"Darius Zero",
address:"sFGhKnzJfbbnFTbiVMp93H4iamP1cJMhbfMydppjp6F"
}

];


let provider=null;
let umi=null;
let connected=false;


const connectButton=
document.getElementById("connect");

const updateButton=
document.getElementById("update");

const walletText=
document.getElementById("wallet");

const status=
document.getElementById("status");


function getPhantom(){

if(
window.phantom &&
window.phantom.solana
){

return window.phantom.solana;

}

if(window.solana){

return window.solana;

}

return null;

}


function log(text,type=""){

const div=
document.createElement("div");

div.className=
"asset "+type;

div.innerHTML=text;

status.appendChild(div);

}


connectButton.onclick=async()=>{

try{

provider=getPhantom();

if(!provider){

log(
"❌ Phantom provider not found.",
"error"
);

return;

}


const response=
await provider.connect();


const address=
response.publicKey.toString();


walletText.innerText=
"Connected: "+address;


connectButton.innerText=
"PHANTOM CONNECTED";


connected=true;

updateButton.disabled=false;


log(
"Phantom connected successfully ✓",
"ok"
);


}catch(error){

console.error(error);

log(
"Connection failed ✕<br>"+
(error.message||error),
"error"
);

}

};


async function updateAsset(asset){

const metadataUri=
`https://persia2099-ai.github.io/persia2099/metadata/${asset.number}.json`;


const assetKey=
publicKey(asset.address);


/*
Create Umi using Devnet.
*/

const umiClient=
createUmi(
"https://api.devnet.solana.com"
);

umiClient.use(mplCore());


/*
Create a signer that delegates
signing to Phantom.
*/

const phantomSigner={

publicKey:publicKey(
provider.publicKey.toString()
),

signMessage:async(message)=>{

return await provider.signMessage(
message
);

},

signTransaction:async(transaction)=>{

return await provider.signTransaction(
transaction
);

},

signAllTransactions:async(transactions)=>{

return await provider.signAllTransactions(
transactions
);

}

};


umiClient.use(
signerIdentity(
phantomSigner
)
);


/*
Create Core update instruction.
*/

const instruction=
update(umiClient,{

asset:assetKey,

name:asset.name,

uri:metadataUri

});


/*
Build transaction.
*/

const tx=
await instruction
.buildWithLatestBlockhash(
umiClient
);


/*
Ask Phantom to sign.
*/

const signed=
await provider.signTransaction(tx);


/*
Send signed transaction to Devnet.
*/

const signature=
await umiClient.rpc.sendTransaction(
signed
);


return signature;

}


updateButton.onclick=async()=>{

if(!connected){

alert("Connect Phantom first.");

return;

}


updateButton.disabled=true;

status.innerHTML="";


for(const asset of ASSETS){

try{

log(
`⏳ Updating #${asset.number} — ${asset.name}...`
);


const signature=
await updateAsset(asset);


log(
`#${asset.number} — ${asset.name} UPDATED ✓<br>
Signature:<br>${signature}`,
"ok"
);


}catch(error){

console.error(error);

log(
`#${asset.number} — ${asset.name} FAILED ✕<br>
${error.message||error}`,
"error"
);

}

}


log(
"<strong>ALL 6 ASSETS PROCESSED</strong>",
"ok"
);


updateButton.disabled=false;

};

</script>

</body>
</html>
