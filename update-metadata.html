<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persia 2099 — Metadata Update</title>

<style>
body{
  background:#05070b;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
  max-width:700px;
  margin:auto
}
h1{text-align:center;color:#d4af37}
h2{text-align:center}
button{
  width:100%;
  padding:18px;
  margin:10px 0;
  border:0;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}
#connect{background:#d4af37;color:#000}
#update{background:#2563eb;color:#fff}
button:disabled{opacity:.45}
#wallet{text-align:center;color:#aaa;margin:15px 0;word-break:break-all}
.asset{
  border:1px solid #333;
  border-radius:8px;
  padding:12px;
  margin:10px 0;
  word-break:break-word
}
.ok{color:#4ade80}
.error{color:#f87171}
</style>
</head>

<body>

<h1>PERSIA 2099</h1>
<h2>METADATA UPDATE</h2>

<div id="wallet">Wallet not connected</div>

<button id="connect">CONNECT PHANTOM</button>

<button id="update" disabled>
UPDATE ALL 6 ASSETS
</button>

<div id="status"></div>

<script type="module">

import {
  createUmi
} from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import {
  publicKey
} from "https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  mplCore,
  update,
  fetchAsset
} from "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0?deps=@metaplex-foundation/umi@1.4.1";

import {
  walletAdapterIdentity
} from "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1?deps=@metaplex-foundation/umi@1.4.1";

import {
  PhantomWalletAdapter
} from "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28";


const ASSETS = [

{
number:"001",
name:"Arash 2099",
address:"D4CBoNmuCm2GDSwJi2YHyxTMte66nJGNYE55WJWa4kzU"
},

{
number:"002",
name:"Cyrus Prime",
address:"47KQo8ddMP2q6z3zzs1E85f24cRgEFCe52iudvY2eG2K"
},

{
number:"003",
name:"Mithra",
address:"3ZUJcmFQMcGbk4MdAeGoY3DLkY1us2hxbbFNzeD1H9mZ"
},

{
number:"004",
name:"Anahita",
address:"BmUjwD3D3bPDYGu7hoR38VNNnhbcSxBwJgnRxkFpCxGk"
},

{
number:"005",
name:"Rostam X",
address:"9xHiNWXKfuhE2rVvCZXqNmD2gSLKj4KwRbRTTbLf2StS"
},

{
number:"006",
name:"Darius Zero",
address:"sFGhKnzJfbbnFTbiVMp93H4iamP1cJMhbfMydppjp6F"
}

];


let wallet = null;
let umi = null;


const connectButton =
document.getElementById("connect");

const updateButton =
document.getElementById("update");

const walletText =
document.getElementById("wallet");

const status =
document.getElementById("status");


function log(text,type=""){

const div =
document.createElement("div");

div.className =
"asset " + type;

div.innerHTML = text;

status.appendChild(div);

}


connectButton.onclick = async()=>{

try{

status.innerHTML = "";

wallet =
new PhantomWalletAdapter();

await wallet.connect();


/*
IMPORTANT:
Umi is created from
umi-bundle-defaults so the
program repository exists.
*/

umi =
createUmi(
"https://api.devnet.solana.com"
)
.use(mplCore())
.use(
walletAdapterIdentity(wallet)
);


walletText.innerText =
"Connected: " +
wallet.publicKey.toString();


connectButton.innerText =
"PHANTOM CONNECTED";


updateButton.disabled = false;


log(
"Phantom connected ✓",
"ok"
);


}catch(error){

console.error(error);

log(
"CONNECTION FAILED ✕<br>" +
(error.message || error),
"error"
);

}

};


updateButton.onclick = async()=>{

if(!umi || !wallet){

alert("Connect Phantom first.");

return;

}


updateButton.disabled = true;

status.innerHTML = "";


for(const item of ASSETS){

try{

log(
`⏳ Checking #${item.number} — ${item.name}...`
);


const assetAddress =
publicKey(item.address);


/*
Fetch the actual Core Asset.
*/

const asset =
await fetchAsset(
umi,
assetAddress
);


log(
`Asset found ✓<br>
Update Authority:<br>
${asset.updateAuthority}`
);


/*
New metadata URI.
*/

const metadataUri =
`https://persia2099-ai.github.io/persia2099/metadata/${item.number}.json`;


/*
Create and send the official
MPL Core update transaction.
*/

await update(umi,{

asset:assetAddress,

name:item.name,

uri:metadataUri

}).sendAndConfirm(umi);


log(
`#${item.number} — ${item.name} UPDATED ✓`,
"ok"
);


}catch(error){

console.error(error);

log(
`#${item.number} — ${item.name} FAILED ✕<br><br>
${error.message || error}`,
"error"
);

}

}


log(
"<strong>PROCESS COMPLETE</strong>",
"ok"
);


updateButton.disabled = false;

};

</script>

</body>
</html>
