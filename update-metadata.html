<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persia 2099 — Metadata Update</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:#fff;
  padding:20px;
}

button{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
}

#connect{
  background:#fff;
  color:#000;
}

#update{
  background:#222;
  color:#fff;
}

#status{
  margin-top:20px;
  white-space:pre-wrap;
  background:#15151d;
  padding:15px;
  border-radius:10px;
  line-height:1.5;
  word-break:break-word;
}
</style>
</head>

<body>

<h2>PERSIA 2099</h2>
<p>GENESIS GUARDIANS — METADATA UPDATE</p>

<button id="connect">CONNECT PHANTOM</button>

<button id="update" disabled>
UPDATE ALL 6 ASSETS
</button>

<div id="status">
Waiting...
</div>


<script type="module">

import {
  createUmi
} from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import {
  publicKey
} from "https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  mplCore,
  fetchAsset,
  fetchCollection,
  collectionAddress,
  update
} from "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0?deps=@metaplex-foundation/umi@1.4.1";

import {
  PhantomWalletAdapter
} from "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28?deps=@solana/web3.js@1.98.4";

import {
  walletAdapterIdentity
} from "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1?deps=@metaplex-foundation/umi@1.4.1";


const COLLECTION =
"6XGhHkPAHJ5XayXwn1p7t3XEUmyYEx3racfwnpbEwp6a";


const ASSETS = [

{
number:"001",
name:"Arash 2099",
asset:"D4CBoNmuCm2GDSwJi2YHyxTMte66nJGNYE55WJWa4kzU",
uri:"https://persia2099-ai.github.io/persia2099/metadata/001.json"
},

{
number:"002",
name:"Cyrus Prime",
asset:"47KQo8ddMP2q6z3zzs1E85f24cRgEFCe52iudvY2eG2K",
uri:"https://persia2099-ai.github.io/persia2099/metadata/002.json"
},

{
number:"003",
name:"Mithra",
asset:"3ZUJcmFQMcGbk4MdAeGoY3DLkY1us2hxbbFNzeD1H9mZ",
uri:"https://persia2099-ai.github.io/persia2099/metadata/003.json"
},

{
number:"004",
name:"Anahita",
asset:"BmUjwD3D3bPDYGu7hoR38VNNnhbcSxBwJgnRxkFpCxGk",
uri:"https://persia2099-ai.github.io/persia2099/metadata/004.json"
},

{
number:"005",
name:"Rostam X",
asset:"9xHiNWXKfuhE2rVvCZXqNmD2gSLKj4KwRbRTTbLf2StS",
uri:"https://persia2099-ai.github.io/persia2099/metadata/005.json"
},

{
number:"006",
name:"Darius Zero",
asset:"sFGhKnzJfbbnFTbiVMp93H4iamP1cJMhbfMydppjp6F",
uri:"https://persia2099-ai.github.io/persia2099/metadata/006.json"
}

];


const wallet =
new PhantomWalletAdapter();

let umi = null;

const status =
document.getElementById("status");

const connectBtn =
document.getElementById("connect");

const updateBtn =
document.getElementById("update");


function log(text){

status.textContent +=
text + "\n";

}


/* CONNECT */

connectBtn.onclick = async () => {

try{

status.textContent =
"Connecting Phantom...\n";

await wallet.connect();

umi =
createUmi(
"https://api.devnet.solana.com"
)
.use(mplCore())
.use(walletAdapterIdentity(wallet));


log(
"Phantom connected ✓"
);

log(
"\nWallet:\n" +
wallet.publicKey.toString()
);

updateBtn.disabled = false;

}
catch(error){

status.textContent =
"CONNECT ERROR:\n\n" +
(error?.message || error);

}

};


/* UPDATE ONE ASSET */

async function updateAsset(item){

log(
"\n============================\n" +
item.number + " — " +
item.name +
"\n============================"
);

log(
"Fetching asset..."
);

const asset =
await fetchAsset(
umi,
publicKey(item.asset)
);


const currentCollection =
collectionAddress(asset);


if(
!currentCollection ||
currentCollection.toString() !== COLLECTION
){

throw new Error(
"Collection mismatch for " +
item.name
);

}


log(
"Asset verified ✓"
);

log(
"Collection verified ✓"
);

log(
"\nNew Metadata URI:\n" +
item.uri
);


/*
Fetch the CURRENT collection
immediately before transaction.
*/

const collection =
await fetchCollection(
umi,
publicKey(COLLECTION)
);


log(
"\nCollection authority verified ✓"
);


/*
IMPORTANT:
For an Asset whose update authority
is the Collection, the current
Collection must be passed to update().
*/

log(
"\nRequesting Phantom signature..."
);


const result =
await update(
umi,
{
asset:asset,
collection:collection,
uri:item.uri
}
).sendAndConfirm(umi);


log(
"\nUPDATED ✓"
);


/*
Umi returns signature bytes.
The transaction itself has already
been confirmed at this point.
*/

log(
"Transaction confirmed ✓"
);

}


/* UPDATE ALL */

updateBtn.onclick = async () => {

if(!umi){

status.textContent =
"Connect Phantom first.";

return;

}

updateBtn.disabled = true;

status.textContent =
"Starting metadata update...\n";


try{


/*
Check Collection authority.
*/

const collection =
await fetchCollection(
umi,
publicKey(COLLECTION)
);

const authority =
collection.updateAuthority;


log(
"Collection Authority:\n" +
(authority?.address || authority)
);


if(
authority?.address &&
authority.address !==
umi.identity.publicKey.toString()
){

throw new Error(
"Connected wallet is NOT the Collection authority."
);

}


log(
"\nAuthority verified ✓"
);


/*
Process one NFT at a time.
*/

for(
const item of ASSETS
){

let success = false;

let attempts = 0;


while(
!success &&
attempts < 3
){

attempts++;


try{

log(
"\nAttempt " +
attempts +
"/3"
);


await updateAsset(item);

success = true;


/*
Give RPC a moment before
starting the next transaction.
*/

await new Promise(
resolve =>
setTimeout(resolve,2000)
);

}
catch(error){

const message =
error?.message || String(error);


if(
message.toLowerCase().includes(
"block height exceeded"
) &&
attempts < 3
){

log(
"\nTransaction expired."
);

log(
"Refreshing and retrying..."
);

await new Promise(
resolve =>
setTimeout(resolve,1500)
);

}
else{

throw error;

}

}

}

}


log(
"\n\n============================" +
"\nALL 6 UPDATED SUCCESSFULLY ✓" +
"\n============================"
);


}
catch(error){

console.error(error);

log(
"\n\n❌ UPDATE FAILED\n\n" +
(error?.message || error)
);

updateBtn.disabled = false;

}

};

</script>

</body>
</html>
