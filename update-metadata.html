<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persia 2099</title>

<style>
body{
background:#05070b;
color:white;
font-family:Arial;
text-align:center;
padding:30px 20px;
}
h1{color:#d4af37;font-size:38px}
button{
width:100%;
max-width:600px;
padding:20px;
margin-top:30px;
border:0;
border-radius:10px;
font-size:20px;
font-weight:bold;
background:#d4af37;
color:#000;
}
#status{
margin-top:30px;
font-size:18px;
line-height:1.7;
}
</style>
</head>

<body>

<h1>PERSIA 2099</h1>

<h2>PHANTOM CONNECTION TEST</h2>

<button onclick="connectPhantom()">
CONNECT PHANTOM
</button>

<div id="status">
Ready...
</div>

<script>

async function connectPhantom(){

const status=document.getElementById("status");

status.innerHTML="Checking Phantom...";

try{

let provider=null;

if(
window.phantom &&
window.phantom.solana
){
provider=window.phantom.solana;
}

else if(window.solana){
provider=window.solana;
}

if(!provider){

status.innerHTML=
"❌ PHANTOM PROVIDER NOT FOUND<br><br>"+
"این صفحه داخل Phantom اجرا نشده است.";

return;

}

status.innerHTML=
"⏳ Phantom detected...<br>Connecting...";

const response=
await provider.connect();

status.innerHTML=
"✅ PHANTOM CONNECTED<br><br>"+
"Wallet:<br>"+
response.publicKey.toString();

}catch(error){

status.innerHTML=
"❌ ERROR<br><br>"+
(error.message || error);

}

}

</script>

</body>
</html>
