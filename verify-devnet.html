<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persia 2099 — Devnet Asset Verifier</title>
<style>
body{font-family:Arial,sans-serif;background:#0b0b10;color:#eee;max-width:900px;margin:0 auto;padding:24px}
.card{background:#15151d;border:1px solid #333;border-radius:16px;padding:18px;margin:16px 0}
img{max-width:100%;max-height:520px;border-radius:12px;display:block;margin:16px auto}
code,pre{word-break:break-all;white-space:pre-wrap}
.ok{color:#8cffb0}.err{color:#ff8c8c}
button{padding:12px 18px;border:0;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<h1>Persia 2099 — Devnet Asset Verifier</h1>
<div class="card">
<div id="status">Reading Arash #001 from Devnet…</div>
<div id="data"></div>
<img id="assetImage" alt="Arash 2099 main NFT image" style="display:none">
</div>
<script type="module">
import {createUmi} from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";
import {mplCore,fetchAsset} from "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";
import {publicKey} from "https://esm.sh/@metaplex-foundation/umi@1.4.1";

const RPC="https://api.devnet.solana.com";
const ASSET="D4CBoNmuCm2GDSwJi2YHyxTMte66nJGNYE55WJWa4kzU";
const umi=createUmi(RPC).use(mplCore());
const status=document.getElementById("status");
const data=document.getElementById("data");
const img=document.getElementById("assetImage");

try{
  const asset=await fetchAsset(umi,publicKey(ASSET));
  const metadata=await fetch(asset.uri).then(r=>{
    if(!r.ok) throw new Error("Metadata HTTP "+r.status);
    return r.json();
  });
  status.innerHTML='<span class="ok">✓ Asset and off-chain metadata loaded</span>';
  data.innerHTML=
    "<p><b>Name:</b> "+(asset.name||"")+"</p>"+
    "<p><b>Asset:</b> <code>"+ASSET+"</code></p>"+
    "<p><b>Metadata URI:</b> <code>"+asset.uri+"</code></p>"+
    "<p><b>Image URI:</b> <code>"+(metadata.image||"")+"</code></p>"+
    "<p><b>Metadata:</b></p><pre>"+JSON.stringify(metadata,null,2).replace(/</g,"&lt;")+"</pre>";
  if(metadata.image){img.src=metadata.image;img.style.display="block";}
}catch(e){
  status.innerHTML='<span class="err">✗ '+String(e.message||e)+'</span>';
  data.innerHTML="<p>Could not read the Devnet asset or its metadata.</p>";
}
</script>
</body>
</html>
