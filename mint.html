<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persia 2099 — Arash #001</title>

  <style>
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 30px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #111;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #connect {
      background: white;
      color: black;
    }

    #mint {
      background: #9945ff;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
      line-height: 1.5;
    }

    a {
      color: #9945ff;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Persia 2099</h1>
  <h2>Arash 2099 — #001</h2>

  <img
    src="https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafybeih7x3h5dalag3mlviqrjqu6c7e7rl22eqpabb5auejxwmsopboz24"
    alt="Arash 2099"
  >

  <button id="connect">Connect Phantom</button>

  <button id="mint" disabled>
    Mint Arash #001 — Devnet
  </button>

  <div id="status">Wallet not connected.</div>

</div>

<script type="module">

import { createUmi, generateSigner } from
  "https://esm.sh/@metaplex-foundation/umi@1.4.1";

import { create, mplCore } from
  "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";

import { createUmi as createUmiDefaults } from
  "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import { walletAdapterIdentity } from
  "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1";

import { PhantomWalletAdapter } from
  "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28";


const RPC = "https://api.devnet.solana.com";

const METADATA_URI =
  "https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafkreid2ozmgxjfc6xf4a6r4hvnxnzasnq24cimykprq6jevhxiksunhfi";

const IMAGE_URI =
  "https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafybeih7x3h5dalag3mlviqrjqu6c7e7rl22eqpabb5auejxwmsopboz24";


const status = document.getElementById("status");
const connectButton = document.getElementById("connect");
const mintButton = document.getElementById("mint");


const umi = createUmiDefaults(RPC)
  .use(mplCore());


const wallet = new PhantomWalletAdapter();


connectButton.onclick = async () => {

  try {

    status.innerText = "Connecting Phantom...";

    await wallet.connect();

    umi.use(walletAdapterIdentity(wallet));

    status.innerText =
      "Connected:\n" +
      wallet.publicKey.toBase58();

    connectButton.innerText = "Phantom Connected";

    mintButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.innerText =
      "Phantom connection failed:\n" +
      (error?.message || error);

  }

};


mintButton.onclick = async () => {

  try {

    mintButton.disabled = true;

    status.innerText =
      "Preparing Arash 2099 #001...\n\n" +
      "Please confirm the transaction in Phantom.";

    /*
      Generate a completely new Core Asset address.
      This is required for every new Asset.
    */

    const asset = generateSigner(umi);


    const result = await create(umi, {
  asset,
  name: "Arash 2099",
  uri: METADATA_URI
}).sendAndConfirm(umi, {
  send: {
    skipPreflight: true
  },
  confirm: {
    strategy: {
      type: "blockhash",
      ...(await umi.rpc.getLatestBlockhash())
    }
  }
});


    const signature = result.signature;

    const assetAddress = asset.publicKey;


    status.innerHTML =
      "<strong>SUCCESS!</strong><br><br>" +

      "Arash 2099 #001 was created on Devnet.<br><br>" +

      "<b>Asset:</b><br>" +
      assetAddress + "<br><br>" +

      "<b>Transaction:</b><br>" +

      "<a target='_blank' href='https://explorer.solana.com/tx/" +
      signature +
      "?cluster=devnet'>" +

      "View on Solana Explorer" +

      "</a>";


    console.log("ARASH #001 CREATED");
    console.log("Asset:", assetAddress);
    console.log("Signature:", signature);

  } catch (error) {

    console.error(error);

    status.innerText =
      "Mint failed:\n\n" +
      (error?.message || error);

    mintButton.disabled = false;

  }

};

</script>

</body>
</html>
