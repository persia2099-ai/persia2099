<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persia 2099 — Guardian Mint</title>

<script type="importmap">
{
  "imports": {
    "@metaplex-foundation/umi": "https://esm.sh/@metaplex-foundation/umi@1.4.1",
    "@metaplex-foundation/umi-bundle-defaults": "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1",
    "@metaplex-foundation/mpl-core": "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0",
    "@metaplex-foundation/umi-signer-wallet-adapters": "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1",
    "@solana/wallet-adapter-phantom": "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28"
  }
}
</script>

<style>
body {
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:25px 15px;
}

.box {
  max-width:650px;
  margin:auto;
  border:1px solid #333;
  border-radius:15px;
  padding:25px;
}

input {
  width:90%;
  padding:13px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #444;
  background:#111;
  color:#fff;
}

button {
  padding:14px 24px;
  margin:10px;
  border:0;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

#connect {
  background:#9945ff;
  color:white;
}

#mint {
  background:#14f195;
  color:#000;
  display:none;
}

#status {
  margin-top:20px;
  line-height:1.7;
  word-break:break-word;
}

a {
  color:#14f195;
}
</style>
</head>

<body>

<div class="box">

<h1>Persia 2099</h1>
<h2>GENESIS GUARDIANS</h2>

<p>Darius Zero — Guardian #006</p>

<button id="connect">Connect Phantom</button>

<div id="form" style="display:none;">

<input
id="name"
value="Darius Zero"
placeholder="NFT Name">

<input
id="number"
value="006"
placeholder="Guardian Number">

<input
id="uri"
value="https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafkreihubppse6kojxs4xjpey5xgs6lkpvwarict7xfb4nqhfghdlxzqgy"
placeholder="Metadata URI">

<button id="mint">MINT DARIUS #006</button>

</div>

<div id="status"></div>

</div>

<script type="module">

import { publicKey }
from "@metaplex-foundation/umi";

import { createUmi }
from "@metaplex-foundation/umi-bundle-defaults";

import {
  mplCore,
  create
}
from "@metaplex-foundation/mpl-core";

import {
  walletAdapterIdentity
}
from "@metaplex-foundation/umi-signer-wallet-adapters";

import {
  PhantomWalletAdapter
}
from "@solana/wallet-adapter-phantom";


const RPC = "https://api.devnet.solana.com";

const wallet = new PhantomWalletAdapter();

let umi = null;

const connectButton =
document.getElementById("connect");

const mintButton =
document.getElementById("mint");

const form =
document.getElementById("form");

const status =
document.getElementById("status");


function show(message) {
  status.innerHTML = message;
}


connectButton.onclick = async () => {

  try {

    show("🔄 Connecting Phantom...");

    await wallet.connect();

    umi = createUmi(RPC)
      .use(mplCore())
      .use(walletAdapterIdentity(wallet));

    show(
      "✅ Phantom connected<br><br>" +
      wallet.publicKey.toString()
    );

    form.style.display = "block";
    connectButton.style.display = "none";

  } catch (error) {

    console.error(error);

    show(
      "❌ Connection failed<br><br>" +
      error.message
    );

  }

};


mintButton.onclick = async () => {

  try {

    mintButton.disabled = true;

    show("⏳ Creating Darius Zero #006...");

    const name =
      document.getElementById("name").value.trim();

    const uri =
      document.getElementById("uri").value.trim();

    const asset = await create(umi, {

      name: name,

      uri: uri

    }).sendAndConfirm(umi);


    const assetAddress =
      asset.publicKey.toString();


    show(
      "🎉 MINT SUCCESSFUL!<br><br>" +

      "<b>Darius Zero #006</b><br><br>" +

      "Asset Address:<br>" +
      "<code>" +
      assetAddress +
      "</code><br><br>" +

      "<a target='_blank' href='" +
      "https://explorer.solana.com/address/" +
      assetAddress +
      "?cluster=devnet'>" +

      "View Asset on Solana Explorer" +

      "</a><br><br>" +

      "<a target='_blank' href='" +
      "https://explorer.solana.com/address/" +
      assetAddress +
      "?cluster=devnet'>" +

      "Verify Asset" +

      "</a>"
    );

    mintButton.innerText = "MINTED ✓";

  } catch (error) {

    console.error(error);

    show(
      "❌ Mint failed<br><br>" +
      error.message
    );

    mintButton.disabled = false;

  }

};

</script>

</body>
</html>
