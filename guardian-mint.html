<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persia 2099 — Mithra #003</title>

  <style>
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 30px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #111;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #connect {
      background: white;
      color: black;
    }

    #mint {
      background: #9945ff;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
      line-height: 1.5;
    }

    a {
      color: #9945ff;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Persia 2099</h1>

  <h2>Mithra — #003</h2>

  <img
    src="https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafybeifsk4x44e6i5qx2h7obh4bp4slnlrolkgwnjudlf5yxbs3rgebob4"
    alt="Mithra"
  >

  <button id="connect">
    Connect Phantom
  </button>

  <button id="mint" disabled>
    Mint Mithra #003 — Devnet
  </button>

  <div id="status">
    Wallet not connected.
  </div>

</div>

<script type="module">

import {
  generateSigner,
  publicKey
} from
"https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  create,
  mplCore,
  fetchCollection,
  fetchAsset,
  update,
  updateAuthority
} from
"https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";

import {
  createUmi
} from
"https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import {
  walletAdapterIdentity
} from
"https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1";

import {
  PhantomWalletAdapter
} from
"https://esm.sh/@solana/wallet-adapter-phantom@0.9.28";

import {
  base58
} from
"https://esm.sh/@metaplex-foundation/umi@1.4.1/serializers";


const RPC =
"https://api.devnet.solana.com";


const COLLECTION_ADDRESS =
"6XGhHkPAHJ5XayXwn1p7t3XEUmyYEx3racfwnpbEwp6a";


const GUARDIAN = {

  name:
  "Mithra",

  number:
  "003",

  metadata:
  "https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafkreidh4nkct4kt4kg4lqwolwbmjfvyce4dhavydrjuk5ebnz7dzy4us4"

};


const status =
document.getElementById("status");

const connectButton =
document.getElementById("connect");

const mintButton =
document.getElementById("mint");


const umi =
createUmi(RPC)
.use(mplCore());


const wallet =
new PhantomWalletAdapter();


function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}


connectButton.onclick = async () => {

  try {

    status.innerText =
    "Connecting Phantom...";

    await wallet.connect();

    umi.use(
      walletAdapterIdentity(wallet)
    );

    status.innerText =
    "Connected:\n" +
    wallet.publicKey.toBase58();

    connectButton.innerText =
    "Phantom Connected";

    mintButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.innerText =
    "Connection failed:\n\n" +
    (error?.message || error);

  }

};


mintButton.onclick = async () => {

  let assetAddress = null;
  let mintSignature = null;

  try {

    mintButton.disabled = true;

    status.innerText =
    "Preparing Mithra #003...\n\n" +
    "Please confirm the Mint transaction in Phantom.";


    const asset =
    generateSigner(umi);


    assetAddress =
    asset.publicKey.toString();


    /*
      STEP 1
      Mint Mithra
    */

    const createResult =
    await create(umi, {

      asset,

      name:
      GUARDIAN.name,

      uri:
      GUARDIAN.metadata

    }).sendAndConfirm(umi, {

      send: {
        skipPreflight: true
      },

      confirm: {
        strategy: {
          type: "blockhash",
          ...(await umi.rpc.getLatestBlockhash())
        }
      }

    });


    mintSignature =
    base58.deserialize(
      createResult.signature
    )[0];


    status.innerText =
    "Mithra #003 Minted successfully.\n\n" +

    "Asset:\n" +
    assetAddress +

    "\n\nWaiting for Devnet RPC...\n\n" +

    "Do NOT close this page.";


    /*
      IMPORTANT:
      Wait for the new Asset to become visible
      through the RPC before trying fetchAsset().
    */

    let fetchedAsset = null;

    for (
      let attempt = 1;
      attempt <= 12;
      attempt++
    ) {

      await sleep(3000);

      try {

        fetchedAsset =
        await fetchAsset(
          umi,
          publicKey(assetAddress)
        );

        if (fetchedAsset) {
          break;
        }

      } catch (e) {

        console.log(
          "Waiting for Asset...",
          attempt
        );

      }

      status.innerText =
      "Mithra #003 Minted.\n\n" +

      "Asset:\n" +
      assetAddress +

      "\n\nWaiting for Devnet RPC... " +

      attempt +
      "/12";

    }


    /*
      If RPC still cannot see Asset,
      DO NOT mint again.
    */

    if (!fetchedAsset) {

      status.innerHTML =

      "<strong>MITHRA #003 CREATED</strong><br><br>" +

      "<b>Asset:</b><br>" +
      assetAddress +

      "<br><br>" +

      "<b>Mint Transaction:</b><br>" +

      "<a target='_blank' href='https://explorer.solana.com/tx/" +
      mintSignature +
      "?cluster=devnet'>" +

      "View Mint Transaction" +

      "</a>" +

      "<br><br>" +

      "Asset is still propagating on Devnet.<br>" +

      "<b>Do NOT Mint Again.</b>";

      return;
    }


    /*
      STEP 2
      Load Collection
    */

    status.innerText =
    "Mithra #003 detected.\n\n" +

    "Loading Genesis Guardians Collection...\n\n" +

    "Please confirm the Collection transaction in Phantom.";


    const collection =
    await fetchCollection(
      umi,
      publicKey(COLLECTION_ADDRESS)
    );


    /*
      STEP 3
      Attach existing Asset
    */

    const collectionResult =
    await update(umi, {

      asset:
      fetchedAsset,

      newCollection:
      collection.publicKey,

      newUpdateAuthority:
      updateAuthority(
        "Collection",
        [collection.publicKey]
      )

    }).sendAndConfirm(umi);


    const collectionSignature =
    base58.deserialize(
      collectionResult.signature
    )[0];


    /*
      FINAL SUCCESS
    */

    status.innerHTML =

    "<strong>SUCCESS!</strong><br><br>" +

    "Mithra #003 is now part of<br>" +

    "Persia 2099 — GENESIS GUARDIANS." +

    "<br><br>" +

    "<b>Asset:</b><br>" +
    assetAddress +

    "<br><br>" +

    "<b>Collection:</b><br>" +
    COLLECTION_ADDRESS +

    "<br><br>" +

    "<b>Mint Transaction:</b><br>" +

    "<a target='_blank' href='https://explorer.solana.com/tx/" +
    mintSignature +
    "?cluster=devnet'>" +

    "View Mint Transaction" +

    "</a>" +

    "<br><br>" +

    "<b>Collection Transaction:</b><br>" +

    "<a target='_blank' href='https://explorer.solana.com/tx/" +
    collectionSignature +
    "?cluster=devnet'>" +

    "View Collection Transaction" +

    "</a>";


    console.log(
      "MITHRA #003 CREATED"
    );

    console.log(
      "Asset:",
      assetAddress
    );

    console.log(
      "Mint:",
      mintSignature
    );

    console.log(
      "Collection:",
      collectionSignature
    );


  } catch (error) {

    console.error(error);


    /*
      IMPORTANT:
      If Mint already succeeded, never tell the user
      to Mint again.
    */

    if (assetAddress) {

      status.innerHTML =

      "<strong>Asset Minted</strong><br><br>" +

      "Mithra #003 may already exist.<br><br>" +

      "<b>Asset:</b><br>" +
      assetAddress +

      "<br><br>" +

      (mintSignature

        ? "<b>Mint Transaction:</b><br>" +

          "<a target='_blank' href='https://explorer.solana.com/tx/" +
          mintSignature +
          "?cluster=devnet'>" +

          "View Mint Transaction" +

          "</a><br><br>"

        : "") +

      "<b>Do NOT Mint Again.</b><br>" +

      "Send this Asset address to continue the Collection step.";

    } else {

      status.innerText =
      "Mint failed:\n\n" +
      (error?.message || error);

      mintButton.disabled = false;

    }

  }

};

</script>

</body>
</html>
