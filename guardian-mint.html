<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rostam X #005 — Collection</title>

  <script type="importmap">
  {
    "imports": {
      "@metaplex-foundation/umi": "https://esm.sh/@metaplex-foundation/umi@1.4.1",
      "@metaplex-foundation/mpl-core": "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0",
      "@metaplex-foundation/umi-bundle-defaults": "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1",
      "@metaplex-foundation/umi-signer-wallet-adapters": "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1",
      "@solana/wallet-adapter-phantom": "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28"
    }
  }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      text-align: center;
      padding: 30px;
    }

    button {
      padding: 14px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #connect {
      background: #9945FF;
      color: white;
    }

    #attach {
      background: #14F195;
      color: black;
      display: none;
    }

    #status {
      margin-top: 20px;
      line-height: 1.7;
      word-break: break-word;
    }

    .box {
      max-width: 600px;
      margin: auto;
      padding: 25px;
      border: 1px solid #333;
      border-radius: 15px;
    }

    code {
      display: block;
      background: #151515;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      word-break: break-all;
    }

    a {
      color: #14F195;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>ROSTAM X</h1>
  <h2>#005</h2>

  <p>Attach existing Asset to Genesis Guardians Collection</p>

  <p>Asset:</p>
  <code id="assetAddress">
    9xHiNWXKfuhE2rVvCZXqNmD2gSLKj4KwRbRTTbLf2StS
  </code>

  <p>Collection:</p>
  <code id="collectionAddress">
    6XGhHkPAHJ5XayXwn1p7t3XEUmyYEx3racfwnpbEwp6a
  </code>

  <button id="connect">Connect Phantom</button>

  <button id="attach">
    ADD ROSTAM TO COLLECTION
  </button>

  <div id="status"></div>

</div>

<script type="module">

import {
  createUmi,
  publicKey
} from "@metaplex-foundation/umi";

import {
  mplCore,
  update,
  fetchAsset,
  fetchCollection,
  updateAuthority,
  collectionAddress
} from "@metaplex-foundation/mpl-core";

import {
  walletAdapterIdentity
} from "@metaplex-foundation/umi-signer-wallet-adapters";

import {
  PhantomWalletAdapter
} from "@solana/wallet-adapter-phantom";

const RPC = "https://api.devnet.solana.com";

const ASSET =
  "9xHiNWXKfuhE2rVvCZXqNmD2gSLKj4KwRbRTTbLf2StS";

const COLLECTION =
  "6XGhHkPAHJ5XayXwn1p7t3XEUmyYEx3racfwnpbEwp6a";

const wallet = new PhantomWalletAdapter();

let umi;

const connectBtn =
  document.getElementById("connect");

const attachBtn =
  document.getElementById("attach");

const status =
  document.getElementById("status");

function show(message) {
  status.innerHTML = message;
}

connectBtn.onclick = async () => {

  try {

    show("Connecting Phantom...");

    await wallet.connect();

    umi = createUmi(RPC)
      .use(mplCore())
      .use(walletAdapterIdentity(wallet));

    show(
      "✅ Phantom connected<br><br>" +
      "Wallet:<br>" +
      wallet.publicKey.toBase58()
    );

    attachBtn.style.display = "inline-block";

  } catch (error) {

    console.error(error);

    show(
      "❌ Connection failed<br><br>" +
      error.message
    );
  }
};


attachBtn.onclick = async () => {

  try {

    attachBtn.disabled = true;

    show("🔎 Checking Rostam Asset...");

    const asset = await fetchAsset(
      umi,
      publicKey(ASSET)
    );

    show(
      "✅ Rostam Asset found.<br><br>" +
      "Checking Collection..."
    );

    const collection = await fetchCollection(
      umi,
      publicKey(COLLECTION)
    );

    /*
      Check whether Rostam is already
      inside a collection.
    */

    const currentCollection =
      collectionAddress(asset);

    if (currentCollection) {

      if (
        currentCollection.toString() ===
        COLLECTION
      ) {

        show(
          "✅ Rostam #005 is ALREADY connected to the Genesis Guardians Collection."
        );

        attachBtn.disabled = false;

        return;
      }

      show(
        "⚠️ Rostam already belongs to another Collection.<br><br>" +
        currentCollection.toString()
      );

      attachBtn.disabled = false;

      return;
    }


    show(
      "🔗 Connecting Rostam #005 to Collection...<br><br>" +
      "Please confirm the transaction in Phantom."
    );


    const result = await update(umi, {

      asset,

      newCollection:
        collection.publicKey,

      newUpdateAuthority:
        updateAuthority(
          "Collection",
          [collection.publicKey]
        )

    }).sendAndConfirm(umi);


    const signature =
      umi
        .transactions
        .deserialize(result.signature);


    show(
      "🎉 SUCCESS!<br><br>" +
      "Rostam X #005 is now connected to<br>" +
      "Persia 2099 — GENESIS GUARDIANS.<br><br>" +

      `<a target="_blank"
      href="https://explorer.solana.com/tx/${result.signature}?cluster=devnet">
      View Collection Transaction
      </a>`
    );

    attachBtn.innerText = "CONNECTED ✓";

  } catch (error) {

    console.error(error);

    show(
      "❌ Collection connection failed:<br><br>" +
      error.message
    );

    attachBtn.disabled = false;
  }

};

</script>

</body>
</html>
