```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persia 2099 — Anahita #004</title>

  <style>
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 30px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #111;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #connect {
      background: white;
      color: black;
    }

    #mint {
      background: #9945ff;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
      line-height: 1.5;
    }

    a {
      color: #9945ff;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Persia 2099</h1>

  <h2>Anahita — #004</h2>

  <img
    src="https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafybeifcmpfidqz33k4is3pu2lnvfzeluissudemuatzgyqbiqh7l43nmq"
    alt="Anahita"
  >

  <button id="connect">
    Connect Phantom
  </button>

  <button id="mint" disabled>
    Mint Anahita #004 — Devnet
  </button>

  <div id="status">
    Wallet not connected.
  </div>

</div>

<script type="module">

import {
  createUmi
} from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import {
  generateSigner,
  publicKey
} from "https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  create,
  mplCore,
  fetchAsset
} from "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";

import {
  walletAdapterIdentity
} from "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1";

import {
  PhantomWalletAdapter
} from "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28";

import {
  base58
} from "https://esm.sh/@metaplex-foundation/umi@1.4.1/serializers";


const RPC =
  "https://api.devnet.solana.com";


const METADATA_URI =
  "https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafkreifqox6u4ujkfhmfcdtruskbyn4pbs7morl77hor5rrceczqaqx454";


const umi =
  createUmi(RPC)
    .use(mplCore());


const wallet =
  new PhantomWalletAdapter();


const status =
  document.getElementById("status");

const connectButton =
  document.getElementById("connect");

const mintButton =
  document.getElementById("mint");


connectButton.onclick = async () => {

  try {

    status.innerText =
      "Connecting Phantom...";

    await wallet.connect();

    umi.use(
      walletAdapterIdentity(wallet)
    );

    status.innerText =
      "Connected:\n\n" +
      wallet.publicKey.toBase58();

    connectButton.innerText =
      "Phantom Connected";

    mintButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.innerText =
      "Connection failed:\n\n" +
      (error?.message || error);

  }

};


mintButton.onclick = async () => {

  let assetAddress = null;
  let signature = null;

  try {

    mintButton.disabled = true;

    status.innerText =
      "Preparing Anahita #004...\n\n" +
      "Please confirm the transaction in Phantom.";


    const asset =
      generateSigner(umi);

    assetAddress =
      asset.publicKey.toString();


    const latestBlockhash =
      await umi.rpc.getLatestBlockhash();


    const result =
      await create(umi, {

        asset,

        name:
        "Anahita",

        uri:
        METADATA_URI

      }).sendAndConfirm(umi, {

        send: {
          skipPreflight: false
        },

        confirm: {
          strategy: {
            type: "blockhash",

            blockhash:
              latestBlockhash.blockhash,

            lastValidBlockHeight:
              latestBlockhash.lastValidBlockHeight
          }
        }

      });


    signature =
      base58.deserialize(
        result.signature
      )[0];


    status.innerText =
      "Verifying transaction on Devnet...";


    /*
      IMPORTANT:
      Do not show SUCCESS until the
      Asset can actually be fetched
      from the blockchain.
    */


    let verifiedAsset = null;


    for (let i = 0; i < 10; i++) {

      try {

        verifiedAsset =
          await fetchAsset(
            umi,
            publicKey(assetAddress)
          );

        if (verifiedAsset) {
          break;
        }

      } catch (verifyError) {

        console.log(
          "Verification attempt",
          i + 1,
          verifyError
        );

      }

      await new Promise(
        resolve =>
          setTimeout(resolve, 2000)
      );

    }


    if (!verifiedAsset) {

      status.innerHTML =

        "<strong>TRANSACTION SENT</strong><br><br>" +

        "The transaction was submitted, " +
        "but the Asset could not yet be verified.<br><br>" +

        "<b>Asset:</b><br>" +
        assetAddress +

        "<br><br>" +

        "<b>Transaction:</b><br>" +

        "<a target='_blank' href='https://explorer.solana.com/tx/" +
        signature +
        "?cluster=devnet'>" +

        "Check on Solana Explorer" +

        "</a><br><br>" +

        "<b>DO NOT MINT AGAIN YET.</b>";

      mintButton.disabled = false;

      return;
    }


    /*
      Only here do we declare SUCCESS.
    */


    status.innerHTML =

      "<strong>SUCCESS!</strong><br><br>" +

      "Anahita #004 was successfully created on Devnet." +

      "<br><br>" +

      "<b>Asset:</b><br>" +
      assetAddress +

      "<br><br>" +

      "<b>Mint Transaction:</b><br>" +

      "<a target='_blank' href='https://explorer.solana.com/tx/" +
      signature +
      "?cluster=devnet'>" +

      "View Mint Transaction" +

      "</a>" +

      "<br><br>" +

      "Send this Asset address to continue the Collection step.";


    console.log(
      "ANAHITA #004 VERIFIED"
    );

    console.log(
      "ASSET:",
      assetAddress
    );

    console.log(
      "SIGNATURE:",
      signature
    );


  } catch (error) {

    console.error(error);


    status.innerHTML =

      "<strong>Mint failed.</strong><br><br>" +

      (error?.message || error) +

      "<br><br>" +

      "No SUCCESS message was issued.";

    mintButton.disabled = false;

  }

};

</script>

</body>
</html>
