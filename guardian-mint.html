<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persia 2099 — Guardian Mint</title>

  <style>
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 30px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #111;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #connect {
      background: white;
      color: black;
    }

    #mint {
      background: #9945ff;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
      line-height: 1.5;
    }

    a {
      color: #9945ff;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Persia 2099</h1>
  <h2 id="guardianName">Cyrus Prime — #002</h2>

  <img
    id="guardianImage"
    src="https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafybeia5r6ap3iouarmxmcr3rjp5yjhunow37mbamblyfkar5slfilhpsm"
    alt="Cyrus Prime"
  >

  <button id="connect">
    Connect Phantom
  </button>

  <button id="mint" disabled>
    Mint Cyrus Prime #002 — Devnet
  </button>

  <div id="status">
    Wallet not connected.
  </div>

</div>

<script type="module">

import {
  generateSigner,
  publicKey
} from
"https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  create,
  mplCore,
  update,
  fetchCollection,
  updateAuthority
} from
"https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";

import {
  createUmi
} from
"https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import {
  walletAdapterIdentity
} from
"https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1";

import {
  PhantomWalletAdapter
} from
"https://esm.sh/@solana/wallet-adapter-phantom@0.9.28";

import {
  base58
} from
"https://esm.sh/@metaplex-foundation/umi@1.4.1/serializers";


const RPC =
"https://api.devnet.solana.com";


const COLLECTION_ADDRESS =
"6XGhHkPAHJ5XayXwn1p7t3XEUmyYEx3racfwnpbEwp6a";


const GUARDIAN = {

  name:
  "Cyrus Prime",

  number:
  "002",

  image:
  "https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafybeia5r6ap3iouarmxmcr3rjp5yjhunow37mbamblyfkar5slfilhpsm",

  metadata:
  "https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafkreifvvqy35dspmluwl5hbmmsvy54wc52v7mfzp67ha552nk5wet4qw4"

};


const status =
document.getElementById("status");

const connectButton =
document.getElementById("connect");

const mintButton =
document.getElementById("mint");


const umi =
createUmi(RPC)
.use(mplCore());


const wallet =
new PhantomWalletAdapter();


connectButton.onclick = async () => {

  try {

    status.innerText =
    "Connecting Phantom...";

    await wallet.connect();

    umi.use(
      walletAdapterIdentity(wallet)
    );

    status.innerText =
    "Connected:\n" +
    wallet.publicKey.toBase58();

    connectButton.innerText =
    "Phantom Connected";

    mintButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.innerText =
    "Connection failed:\n\n" +
    (error?.message || error);

  }

};


mintButton.onclick = async () => {

  try {

    mintButton.disabled = true;

    status.innerText =
    "Preparing " +
    GUARDIAN.name +
    " #" +
    GUARDIAN.number +
    "...\n\n" +
    "Please confirm the transaction in Phantom.";


    const collection =
    await fetchCollection(
      umi,
      publicKey(COLLECTION_ADDRESS)
    );


    const asset =
    generateSigner(umi);


    const createResult =
    await create(umi, {

      asset,

      name:
      GUARDIAN.name,

      uri:
      GUARDIAN.metadata

    }).sendAndConfirm(umi, {

      send: {
        skipPreflight: true
      },

      confirm: {
        strategy: {
          type: "blockhash",
          ...(await umi.rpc.getLatestBlockhash())
        }
      }

    });


    const mintSignature =
    base58.deserialize(
      createResult.signature
    )[0];


    status.innerText =
    "Guardian created.\n\n" +
    "Now adding to Genesis Collection...\n\n" +
    "Please confirm the second transaction in Phantom.";


    const collectionResult =
    await update(umi, {

      asset:
      await import(
        "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0"
      ).then(
        ({ fetchAsset }) =>
        fetchAsset(
          umi,
          asset.publicKey
        )
      ),

      newCollection:
      collection.publicKey,

      newUpdateAuthority:
      updateAuthority(
        "Collection",
        [collection.publicKey]
      )

    }).sendAndConfirm(umi, {

      send: {
        skipPreflight: true
      },

      confirm: {
        strategy: {
          type: "blockhash",
          ...(await umi.rpc.getLatestBlockhash())
        }
      }

    });


    const collectionSignature =
    base58.deserialize(
      collectionResult.signature
    )[0];


    status.innerHTML =

    "<strong>SUCCESS!</strong><br><br>" +

    GUARDIAN.name +
    " #" +
    GUARDIAN.number +
    " is now part of<br>" +

    "Persia 2099 — GENESIS GUARDIANS." +

    "<br><br>" +

    "<b>Asset:</b><br>" +
    asset.publicKey.toString() +

    "<br><br>" +

    "<b>Mint:</b><br>" +

    "<a target='_blank' href='https://explorer.solana.com/tx/" +
    mintSignature +
    "?cluster=devnet'>" +

    "View Mint Transaction" +

    "</a>" +

    "<br><br>" +

    "<b>Collection:</b><br>" +

    "<a target='_blank' href='https://explorer.solana.com/tx/" +
    collectionSignature +
    "?cluster=devnet'>" +

    "View Collection Transaction" +

    "</a>";


    console.log(
      "GUARDIAN:",
      GUARDIAN.name
    );

    console.log(
      "ASSET:",
      asset.publicKey.toString()
    );

    console.log(
      "MINT:",
      mintSignature
    );

    console.log(
      "COLLECTION:",
      collectionSignature
    );


  } catch (error) {

    console.error(error);

    status.innerText =
    "Mint failed:\n\n" +
    (error?.message || error);

    mintButton.disabled = false;

  }

};

</script>

</body>
</html>
