<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persia 2099 — Mainnet Collection</title>
<style>
body{margin:0;background:#07080c;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:90%;max-width:460px;padding:30px;text-align:center;background:#10131b;border:1px solid #293247;border-radius:18px}
img{width:100%;border-radius:14px;margin:15px 0 20px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
#connect{background:#fff;color:#000}#create{background:#7047ff;color:#fff}button:disabled{opacity:.5}
#status{margin-top:20px;line-height:1.5;word-break:break-word}a{color:#a980ff}
</style>
</head>
<body>
<div class="box">
<h1>PERSIA 2099</h1>
<h2>GENESIS GUARDIANS</h2>
<img src="https://persia2099-ai.github.io/persia2099/arash-2099.png" alt="Persia 2099">
<p>Mainnet Collection Creation</p>
<button id="connect">CONNECT PHANTOM</button>
<button id="create" disabled>CREATE MAINNET COLLECTION</button>
<div id="status">Wallet not connected.</div>
</div>
<script type="module">
import { generateSigner, createNoopSigner, publicKey, signerIdentity } from "https://esm.sh/@metaplex-foundation/umi@1.4.1";
import { createCollection, mplCore, ruleSet } from "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";
import { createUmi } from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";
import { toWeb3JsTransaction, fromWeb3JsTransaction } from "https://esm.sh/@metaplex-foundation/umi-web3js-adapters@1.1.0";
import { Connection } from "https://esm.sh/@solana/web3.js@1.98.4";

const RPC="https://rpc.solanatracker.io/public";
const URI="https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafkreid2ozmgxjfc6xf4a6r4hvnxnzasnq24cimykprq6jevhxiksunhfi";
const status=document.getElementById("status");
const connectButton=document.getElementById("connect");
const createButton=document.getElementById("create");
const provider=window.phantom?.solana;
const connection=new Connection(RPC,"confirmed");
const umi=createUmi(RPC).use(mplCore());

if(!provider){
 status.innerText="Phantom provider not found. Open this page inside Phantom.";
}

connectButton.onclick=async()=>{
 try{
  if(!provider) throw new Error("Phantom provider not found.");
  status.innerText="Connecting Phantom...";
  const result=await provider.connect();
  const walletAddress=result?.publicKey?.toBase58?.()||provider.publicKey?.toBase58?.();
  if(!walletAddress) throw new Error("Phantom did not return a wallet address.");
  status.innerText="Connected:\n"+walletAddress;
  connectButton.innerText="PHANTOM CONNECTED";
  createButton.disabled=false;
 }catch(e){
  console.error(e);
  status.innerText="Connection failed:\n"+(e?.message||e);
 }
};

createButton.onclick=async()=>{
 try{
  createButton.disabled=true;
  if(!provider?.publicKey) throw new Error("Connect Phantom first.");

  status.innerText="Building and simulating transaction...";

  const walletPk=publicKey(provider.publicKey.toBase58());
  const walletNoop=createNoopSigner(walletPk);

  // Core requires a fresh signer for the Collection account.
  // Use a noop signer while building so Phantom is the first signer.
  const collection=generateSigner(umi);
  const collectionNoop=createNoopSigner(collection.publicKey);

  umi.use(signerIdentity(walletNoop));

  const builder=createCollection(umi,{
   collection:collectionNoop,
   payer:walletNoop,
   name:"Persia 2099 — Genesis Guardians",
   uri:URI,
   plugins:[{
    type:"Royalties",
    basisPoints:500,
    creators:[{address:walletPk,percentage:100}],
    ruleSet:ruleSet("None")
   }]
  }).useLegacyVersion().setFeePayer(walletPk);

  const txUmi=await builder.buildWithLatestBlockhash(umi);
  const txWeb3=toWeb3JsTransaction(txUmi);

  const simulation=await connection.simulateTransaction(txWeb3,{sigVerify:false});
  if(simulation.value.err){
   const logs=simulation.value.logs?.join("\n")||"No simulation logs.";
   throw new Error("Preflight simulation failed:\n"+JSON.stringify(simulation.value.err)+"\n\n"+logs);
  }

  status.innerText="Simulation passed. Phantom will now sign.\n\nCheck the transaction details before approving.";

  // Phantom signs first; the fresh Collection keypair signs second.
  const phantomSigned=await provider.signTransaction(txWeb3);
  const partiallySigned=fromWeb3JsTransaction(phantomSigned);
  const fullySigned=await collection.signTransaction(partiallySigned);

  status.innerText="Sending transaction...";
  const signature=await umi.rpc.sendTransaction(fullySigned);

  await umi.rpc.confirmTransaction(signature,{
   strategy:{type:"blockhash",...txUmi.blockhash},
   commitment:"confirmed"
  });

  const sigText=Array.from(signature).map(b=>String.fromCharCode(b)).join("");
  const collectionAddress=collection.publicKey.toString();

  status.innerHTML="<strong>COLLECTION CREATED</strong><br><br>Collection:<br>"+collectionAddress+
   "<br><br>Transaction submitted.<br><a target='_blank' href='https://explorer.solana.com/address/"+collectionAddress+"'>View Collection</a>";
 }catch(e){
  console.error(e);
  status.innerText="Collection creation failed:\n\n"+(e?.message||e);
  createButton.disabled=false;
 }
};
</script>
</body>
</html>
