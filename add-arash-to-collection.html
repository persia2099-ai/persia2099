<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persia 2099 — Add Arash to Collection</title>
  <style>
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 30px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #111;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #connect {
      background: white;
      color: black;
    }

    #add {
      background: #9945ff;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
      line-height: 1.5;
    }

    a {
      color: #9945ff;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Persia 2099</h1>
  <h2>Arash #001</h2>

  <p>Add Arash 2099 to GENESIS GUARDIANS</p>

  <button id="connect">Connect Phantom</button>

  <button id="add" disabled>
    Add Arash to Collection
  </button>

  <div id="status">Wallet not connected.</div>

</div>

<script type="module">

import {
  createUmi
} from "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import {
  publicKey
} from "https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  update,
  fetchAsset,
  fetchCollection,
  updateAuthority,
  mplCore
} from "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";

import {
  walletAdapterIdentity
} from "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1";

import {
  PhantomWalletAdapter
} from "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28";

import {
  base58
} from "https://esm.sh/@metaplex-foundation/umi@1.4.1/serializers";


const RPC =
  "https://api.devnet.solana.com";

const ASSET_ADDRESS =
  "D4CBoNmuCm2GDSwJi2YHyxTMte66nJGNYE55WJWa4kzU";

const COLLECTION_ADDRESS =
  "6XGhHkPAHJ5XayXwn1p7t3XEUmyYEx3racfwnpbEwp6a";


const status =
  document.getElementById("status");

const connectButton =
  document.getElementById("connect");

const addButton =
  document.getElementById("add");


const umi =
  createUmi(RPC)
    .use(mplCore());


const wallet =
  new PhantomWalletAdapter();


connectButton.onclick = async () => {

  try {

    status.innerText =
      "Connecting Phantom...";

    await wallet.connect();

    umi.use(
      walletAdapterIdentity(wallet)
    );

    status.innerText =
      "Connected:\n" +
      wallet.publicKey.toBase58();

    connectButton.innerText =
      "Phantom Connected";

    addButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.innerText =
      "Connection failed:\n\n" +
      (error?.message || error);

  }

};


addButton.onclick = async () => {

  try {

    addButton.disabled = true;

    status.innerText =
      "Checking Arash #001 and Collection...\n\n" +
      "Please wait.";


    const asset =
      await fetchAsset(
        umi,
        publicKey(ASSET_ADDRESS)
      );


    const collection =
      await fetchCollection(
        umi,
        publicKey(COLLECTION_ADDRESS)
      );


    status.innerText =
      "Arash #001 found.\n" +
      "Collection found.\n\n" +
      "Preparing transaction...\n\n" +
      "Please confirm in Phantom.";


    const result =
      await update(umi, {

        asset,

        newCollection:
          collection.publicKey,

        newUpdateAuthority:
          updateAuthority(
            "Collection",
            [collection.publicKey]
          )

      }).sendAndConfirm(umi, {

        send: {
          skipPreflight: true
        },

        confirm: {
          strategy: {
            type: "blockhash",
            ...(await umi.rpc.getLatestBlockhash())
          }
        }

      });


    const signature =
      base58.deserialize(
        result.signature
      )[0];


    status.innerHTML =
      "<strong>SUCCESS!</strong><br><br>" +

      "Arash 2099 #001 is now part of<br>" +
      "Persia 2099 — GENESIS GUARDIANS.<br><br>" +

      "<b>Asset:</b><br>" +
      ASSET_ADDRESS +
      "<br><br>" +

      "<b>Collection:</b><br>" +
      COLLECTION_ADDRESS +
      "<br><br>" +

      "<a target='_blank' href='https://explorer.solana.com/tx/" +
      signature +
      "?cluster=devnet'>" +
      "View Transaction on Solana Explorer" +
      "</a>";


    console.log(
      "ARASH ADDED TO COLLECTION"
    );

    console.log(
      "Asset:",
      ASSET_ADDRESS
    );

    console.log(
      "Collection:",
      COLLECTION_ADDRESS
    );

    console.log(
      "Signature:",
      signature
    );


  } catch (error) {

    console.error(error);

    status.innerText =
      "Operation failed:\n\n" +
      (error?.message || error);

    addButton.disabled = false;

  }

};

</script>

</body>
</html>
