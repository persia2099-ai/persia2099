<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persia 2099 — Collection</title>

  <style>
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 30px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #111;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #connect {
      background: white;
      color: black;
    }

    #create {
      background: #9945ff;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 20px;
      word-break: break-word;
      line-height: 1.5;
    }

    a {
      color: #9945ff;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Persia 2099</h1>

  <h2>GENESIS GUARDIANS</h2>

  <button id="connect">
    Connect Phantom
  </button>

  <button id="create" disabled>
    Create Collection — Devnet
  </button>

  <div id="status">
    Wallet not connected.
  </div>

</div>

<script type="module">

import {
  generateSigner,
  publicKey
} from
  "https://esm.sh/@metaplex-foundation/umi@1.4.1";

import {
  createCollection,
  mplCore,
  ruleSet
} from
  "https://esm.sh/@metaplex-foundation/mpl-core@1.9.0";

import {
  createUmi
} from
  "https://esm.sh/@metaplex-foundation/umi-bundle-defaults@1.4.1";

import {
  walletAdapterIdentity
} from
  "https://esm.sh/@metaplex-foundation/umi-signer-wallet-adapters@1.1.1";

import {
  PhantomWalletAdapter
} from
  "https://esm.sh/@solana/wallet-adapter-phantom@0.9.28";

import {
  base58
} from
  "https://esm.sh/@metaplex-foundation/umi@1.4.1/serializers";


const RPC =
  "https://api.devnet.solana.com";


const COLLECTION_URI =
  "https://amaranth-eldest-duck-598.mypinata.cloud/ipfs/bafkreialej37mnvjwcmlxsdkdnopv2ia2a7prj6gess2x6qm75hifuxm54";


const status =
  document.getElementById("status");

const connectButton =
  document.getElementById("connect");

const createButton =
  document.getElementById("create");


const umi =
  createUmi(RPC)
    .use(mplCore());


const wallet =
  new PhantomWalletAdapter();


connectButton.onclick = async () => {

  try {

    status.innerText =
      "Connecting Phantom...";

    await wallet.connect();

    umi.use(
      walletAdapterIdentity(wallet)
    );

    status.innerText =
      "Connected:\n" +
      wallet.publicKey.toBase58();

    connectButton.innerText =
      "Phantom Connected";

    createButton.disabled = false;

  } catch (error) {

    console.error(error);

    status.innerText =
      "Connection failed:\n\n" +
      (error?.message || error);

  }

};


createButton.onclick = async () => {

  try {

    createButton.disabled = true;

    status.innerText =
      "Preparing Persia 2099 Collection...\n\n" +
      "Please confirm the transaction in Phantom.";


    /*
      IMPORTANT:
      A Collection requires a completely
      fresh signer/address.
    */

    const collection =
      generateSigner(umi);


    /*
      Create Collection with:
      - Name
      - IPFS metadata
      - 5% royalty
      - Connected Phantom wallet as creator
    */

    const result =
      await createCollection(umi, {

        collection,

        name:
          "Persia 2099 — GENESIS GUARDIANS",

        uri:
          COLLECTION_URI,

        plugins: [

          {

            type:
              "Royalties",

            basisPoints:
              500,

            creators: [

              {

                address:
                  umi.identity.publicKey,

                percentage:
                  100

              }

            ],

            ruleSet:
              ruleSet("None")

          }

        ]

      }).sendAndConfirm(umi, {

        send: {

          skipPreflight: true

        },

        confirm: {

          strategy: {

            type:
              "blockhash",

            ...(await
              umi.rpc.getLatestBlockhash())

          }

        }

      });


    const signature =
      base58.deserialize(
        result.signature
      )[0];


    const collectionAddress =
      collection.publicKey.toString();


    status.innerHTML =

      "<strong>COLLECTION CREATED!</strong><br><br>" +

      "Persia 2099 — GENESIS GUARDIANS<br><br>" +

      "<b>Collection Address:</b><br>" +

      collectionAddress +

      "<br><br>" +

      "<b>Royalty:</b> 5%<br><br>" +

      "<b>Transaction:</b><br>" +

      "<a target='_blank' href='https://explorer.solana.com/tx/" +

      signature +

      "?cluster=devnet'>" +

      "View on Solana Explorer" +

      "</a>" +

      "<br><br>" +

      "<b>Metaplex Explorer:</b><br>" +

      "<a target='_blank' href='https://core.metaplex.com/explorer/" +

      collectionAddress +

      "?env=devnet'>" +

      "View Collection" +

      "</a>";


    console.log(
      "COLLECTION CREATED:",
      collectionAddress
    );

    console.log(
      "SIGNATURE:",
      signature
    );


  } catch (error) {

    console.error(error);

    status.innerText =
      "Collection creation failed:\n\n" +
      (error?.message || error);

    createButton.disabled = false;

  }

};

</script>

</body>
</html>
